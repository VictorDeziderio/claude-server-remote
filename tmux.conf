# Claude Remote — config GLOBAL do tmux (/etc/tmux.conf; fora do volume /root).
# O terminal do painel faz `tmux attach` dentro de um PTY real (xterm.js <-> WebSocket),
# entao a sessao precisa se comportar bem com varios clientes e tamanhos diferentes.

# cores reais (truecolor) dentro da sessao
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# ESC responde na hora (TUI do Claude / vim); historico generoso p/ rolar
set -s escape-time 10
set -g history-limit 20000

# varios clientes na MESMA sessao (painel + Console do EasyPanel): a janela segue
# o tamanho do cliente que interagiu por ultimo, em vez de encolher pro menor.
set -g window-size latest
set -g aggressive-resize on
set -g focus-events on

# mouse: roda de rolagem navega o historico; Shift+arrastar seleciona no navegador
set -g mouse on

# barra de status discreta com o nome da sessao (tema do painel)
set -g status on
set -g status-interval 5
set -g status-style "bg=#11141b,fg=#8b93a7"
set -g status-left-length 40
set -g status-left "#[bg=#D97757,fg=#0b0d12,bold] #S #[default] "
set -g status-right "#[fg=#5b6478]%d/%m %H:%M "
set -g window-status-format "#[fg=#5b6478] #I:#W "
set -g window-status-current-format "#[fg=#e9a78f,bold] #I:#W "
set -g pane-border-style "fg=#1f2530"
set -g pane-active-border-style "fg=#D97757"
set -g message-style "bg=#171b24,fg=#e7e9ee"
set -g set-titles on
set -g set-titles-string "#S"
