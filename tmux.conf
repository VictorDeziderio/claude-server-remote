# Claude Remote — GLOBAL tmux config (/etc/tmux.conf; outside the /root volume).
# The panel terminal runs `tmux attach` inside a real PTY (xterm.js <-> WebSocket),
# so the session must behave well with several clients of different sizes.

# real colors (truecolor) inside the session
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# ESC answers at once (Claude's TUI / vim); generous history to scroll
set -s escape-time 10
set -g history-limit 20000

# several clients on the SAME session (panel + docker exec): the window follows
# the size of the client that interacted last, instead of shrinking to the smallest.
set -g window-size latest
set -g aggressive-resize on
set -g focus-events on

# mouse: the wheel scrolls the history; dragging selects (tmux copy-mode) and, on
# release, COPIES to the browser clipboard (PuTTY style) via OSC 52 — the panel's
# xterm.js handles OSC 52. The tmux selection joins lines wrapped by the width
# (a long URL comes out whole). Shift+drag = the browser's own selection (also copies).
set -g mouse on
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'

# discreet status bar with the session name (panel theme)
set -g status on
set -g status-interval 5
set -g status-style "bg=#11141b,fg=#8b93a7"
set -g status-left-length 40
set -g status-left "#[bg=#D97757,fg=#0b0d12,bold] #S #[default] "
set -g status-right "#[fg=#5b6478]%d/%m %H:%M "
set -g window-status-format "#[fg=#5b6478] #I:#W "
set -g window-status-current-format "#[fg=#e9a78f,bold] #I:#W "
set -g pane-border-style "fg=#1f2530"
set -g pane-active-border-style "fg=#D97757"
set -g message-style "bg=#171b24,fg=#e7e9ee"
set -g set-titles on
set -g set-titles-string "#S"
