# Quick start:  cp .env.example .env  (set PANEL_PASSWORD)  &&  docker compose up -d
# Then open http://localhost:8080 (or https://$PANEL_DOMAIN when PANEL_DOMAIN is set).
services:
  claude:
    # Built locally from this repo (no prebuilt image is published). Update: git pull && docker compose up -d --build
    build: .
    # If you publish your own image, use it instead of `build:`:
    # image: ghcr.io/<you>/claude-server-remote:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"      # panel (HTTP). Put it behind TLS, a VPN or set PANEL_DOMAIN.
      # - "80:80"        # uncomment both when PANEL_DOMAIN is set (automatic HTTPS)
      # - "443:443"
    volumes:
      - claude-home:/root   # projects + Claude login + panel config survive rebuilds
      # - /mnt/backup/claude:/backup   # another disk for VOLUME_BACKUP_DIR=/backup (copies of the volume,
      #                                  # restorable in Backup -> Import / restore)
volumes:
  claude-home:
